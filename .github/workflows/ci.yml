name: CI

# Run on every push and pull request to ensure all changes are validated
# before they reach main. The `release.yml` workflow handles the actual
# package + GitHub Release; this one just ensures the code is healthy.
on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Format, Test
    runs-on: windows-latest  # wpsjs devDep is Windows-only
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests (parallel)
        run: npm test

      - name: Run tests (serial, for stability check)
        # The parallel runner occasionally flakes under heavy CPU
        # contention. The serial runner is deterministic.
        run: npm run test:serial

      - name: Verify 7z artifact
        # The 7z-marker test extracts the published .7z and checks
        # for refactor markers. Skip if no artifact has been built yet
        # (the test handles missing files gracefully).
        run: node --test --test-force-exit tests/7z-marker.test.js

      - name: Build sanity check
        # Verify the package script at least produces a 7z without
        # crashing. We don't upload the artifact from CI (release.yml
        # handles that on tag push).
        run: npm run build

  # Optional: a quick job for docs-only changes. Skipped here because
  # docs/ has no tests; the test job is fast enough on its own.
